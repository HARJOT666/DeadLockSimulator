# Self-Healing Deadlock Simulator — backend configuration.
# Every value can be overridden with environment variables. Defaults are for LOCAL DEVELOPMENT ONLY.
server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

spring:
  application:
    name: deadlock-simulator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deadlock_simulator}
    username: ${DB_USERNAME:user1}
    password: ${DB_PASSWORD:user1}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # Base64-encoded HMAC-SHA256 key (>= 32 bytes). If empty, an EPHEMERAL random key is generated at
    # startup (tokens become invalid on restart) and a warning is logged. Never commit a real secret.
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    cookie-name: dls_token
    # Set to true behind HTTPS. False only so the cookie works on http://localhost during development.
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
